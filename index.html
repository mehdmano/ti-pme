<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TI-PME</title>
    <style>
        /* ---------- RÉINITIALISATION ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ---------- ÉCRAN DE CHARGEMENT - PLEIN ÉCRAN ---------- */
        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1e 0%, #0f1629 100%);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fade-out après 2 secondes */
            animation: fadeOut 0.6s ease-out forwards;
            animation-delay: 1.8s;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* ---------- LOGO - VERSION QUI NE COUPE PAS ---------- */
        .splash-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 2rem;
        }

        .splash-logo img {
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;   /* ← Montre l'image EN ENTIER */
            object-position: center;
        }

        /* ============================================================ */
        /*       ADAPTATION POUR TOUS LES ÉCRANS                       */
        /* ============================================================ */

        /* Ordinateur / grand écran */
        @media (min-width: 1025px) {
            .splash-logo img {
                max-width: 70%;
                max-height: 80%;
            }
        }

        /* Tablette / petit écran */
        @media (max-width: 1024px) {
            .splash-logo img {
                max-width: 75%;
                max-height: 85%;
            }
        }

        /* Téléphone portrait */
        @media (max-width: 768px) and (orientation: portrait) {
            .splash-logo img {
                max-width: 85%;
                max-height: 80vh;
            }
        }

        /* Téléphone paysage */
        @media (max-width: 900px) and (orientation: landscape) {
            .splash-logo img {
                max-width: 60%;
                max-height: 85vh;
            }
        }

        /* Très petits téléphones */
        @media (max-width: 480px) and (orientation: portrait) {
            .splash-logo img {
                max-width: 90%;
                max-height: 75vh;
            }
        }
    </style>
</head>
<body>

    <!-- ====== ÉCRAN DE CHARGEMENT ====== -->
    <div class="splash">
        <div class="splash-logo">
            <img src="logo.png" alt="TI-PME Logo">
        </div>
    </div>

    <!-- ====== REDIRECTION APRÈS 2.4 SECONDES ====== -->
    <script>
        setTimeout(function() {
            window.location.href = "main.html";
        }, 2400);
    </script>

</body>
</html>
